services:
  postgres:
    image: postgres:17

    container_name: quantora-postgres

    restart: unless-stopped

    # Values come from the git-ignored .env file (see .env.example).
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantora}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    # Bound to the loopback interface only: the development database must never be
    # reachable from the local network.
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quantora}"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
