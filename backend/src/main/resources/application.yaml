spring:
  application:
    name: quantora-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/quantora
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:quantora-dev-secret-key-change-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

cors:
  allowed-origin-patterns:
    - http://localhost:*
    - http://127.0.0.1:*